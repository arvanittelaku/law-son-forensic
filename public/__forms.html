<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form detection</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="organisation" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="instruction_type">
        <option value="Expert Witness (Civil)">Expert Witness (Civil)</option>
        <option value="Expert Witness (Family)">Expert Witness (Family)</option>
        <option value="Expert Witness (Criminal)">Expert Witness (Criminal)</option>
        <option value="Financial Investigation">Financial Investigation</option>
        <option value="Preliminary Assessment">Preliminary Assessment</option>
        <option value="Advisory / Litigation Support">Advisory / Litigation Support</option>
        <option value="SJE Appointment">SJE Appointment</option>
        <option value="Other">Other</option>
      </select>
      <select name="practice_area">
        <option value="Commercial Dispute">Commercial Dispute</option>
        <option value="Fraud &amp; Financial Crime">Fraud &amp; Financial Crime</option>
        <option value="Family Proceedings">Family Proceedings</option>
        <option value="Personal Injury / Clinical Negligence">Personal Injury / Clinical Negligence</option>
        <option value="Insolvency">Insolvency</option>
        <option value="Regulatory">Regulatory</option>
        <option value="Other">Other</option>
      </select>
      <input type="date" name="deadline" />
      <textarea name="message"></textarea>
      <select name="referral">
        <option value="Search engine">Search engine</option>
        <option value="Referral from attorney">Referral from attorney</option>
        <option value="Referral from colleague">Referral from colleague</option>
        <option value="LinkedIn">LinkedIn</option>
        <option value="Professional body">Professional body</option>
        <option value="Other">Other</option>
      </select>
    </form>
  </body>
</html>
